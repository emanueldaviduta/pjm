<p-toast></p-toast>

<div class="page">
    <header class="page-header">
        <div>
            <h1 class="page-title">Users</h1>
            <p class="page-subtitle">People who can sign in to PJM.</p>
        </div>
        <div class="page-actions">
            <button pButton type="button" (click)="addUser()" [disabled]="isLoading()">
                <i class="pi pi-plus" pButtonIcon></i>
                <span pButtonLabel>Add user</span>
            </button>
        </div>
    </header>

    <p-table [value]="users()" [tableStyle]="{ 'min-width': '600px' }">
        <ng-template #header>
            <tr>
                <th scope="col">First name</th>
                <th scope="col">Last name</th>
                <th scope="col">Email</th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.email }}</td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr><td colspan="3" class="muted">No users yet.</td></tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Add User" [(visible)]="displayDialog" [modal]="true">
    <div class="flex flex-col gap-4">
        <label pLabel="First Name"></label>
        <input pInputText type="text" placeholder="First Name" [(ngModel)]="user.firstName">
    </div>
    <div class="flex flex-col gap-4">
        <label pLabel="Last Name"></label>
        <input pInputText type="text" placeholder="Last Name" [(ngModel)]="user.lastName">
    </div>
    <div class="flex flex-col gap-4">
        <label pLabel="Email"></label>
        <input pInputText type="text" placeholder="Email" [(ngModel)]="user.email">
    </div>
    <div class="flex flex-col gap-4">
        <label pLabel="Password"></label>
        <input pInputText type="password" placeholder="Password" [(ngModel)]="user.password">
    </div>
    <ng-template #footer>
        <button type="button" pButton severity="secondary" variant="outlined"
            (click)="displayDialog = false">Cancel</button>
        <button type="button" pButton (click)="saveUser()">Save</button>
    </ng-template>
</p-dialog>
