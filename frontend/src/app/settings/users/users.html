<p-toast></p-toast>

<div class="page">
    <header class="page-header">
        <div>
            <h1 class="page-title">Users</h1>
            <p class="page-subtitle">People who can sign in to PJM. Admins can open Settings.</p>
        </div>
        <div class="page-actions">
            <button pButton type="button" (click)="addUser()">
                <i class="pi pi-plus" pButtonIcon></i>
                <span pButtonLabel>Add user</span>
            </button>
        </div>
    </header>

    <p-table [value]="users()" [loading]="loading()" [tableStyle]="{ 'min-width': '600px' }">
        <ng-template #header>
            <tr>
                <th scope="col">First name</th>
                <th scope="col">Last name</th>
                <th scope="col">Email</th>
                <th scope="col">Admin</th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <p-toggleswitch [ngModel]="user.isAdmin" (ngModelChange)="setAdmin(user, $event)"
                        [disabled]="isSaving(user.id)" [ariaLabel]="'Admin: ' + user.firstName + ' ' + user.lastName" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr><td colspan="4" class="muted">No users yet.</td></tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="Add User" [(visible)]="displayDialog" [modal]="true">
    <div class="flex flex-col gap-4">
        <label for="user-first-name">First Name</label>
        <input pInputText id="user-first-name" type="text" placeholder="First Name" [(ngModel)]="user.firstName">
    </div>
    <div class="flex flex-col gap-4">
        <label for="user-last-name">Last Name</label>
        <input pInputText id="user-last-name" type="text" placeholder="Last Name" [(ngModel)]="user.lastName">
    </div>
    <div class="flex flex-col gap-4">
        <label for="user-email">Email</label>
        <input pInputText id="user-email" type="text" placeholder="Email" [(ngModel)]="user.email">
    </div>
    <div class="flex flex-col gap-4">
        <label for="user-password">Password</label>
        <input pInputText id="user-password" type="password" placeholder="Password" [(ngModel)]="user.password">
    </div>
    <ng-template #footer>
        <button type="button" pButton severity="secondary" variant="outlined"
            (click)="displayDialog = false">Cancel</button>
        <button type="button" pButton (click)="saveUser()">Save</button>
    </ng-template>
</p-dialog>
