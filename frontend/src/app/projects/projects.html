<p-dialog header="Add Project" [(visible)]="displayDialog">
    <div class="flex flex-col gap-4">
        <label pLabel="Project Name"></label>
        <input pInputText type="text" placeholder="Project Name" [(ngModel)]="project.name">
    </div>
    <div class="flex flex-col gap-4">
        <label pLabel="Project Description"></label>
        <input pInputText type="text" placeholder="Project Description" [(ngModel)]="project.description">
    </div>
    <ng-template #footer>
        <button type="button" pButton severity="secondary" variant="outlined" (click)="displayDialog = false">Cancel</button>
        <button type="button" pButton (click)="saveProject()">Save</button>
    </ng-template>
</p-dialog>

<button pButton label="Add Project" icon="pi pi-plus" (click)="addProject()" [disabled]="isLoading()">Add
    Project</button>

<p-table [value]="projects">
    <ng-template #header>
        <tr>
            <th>Name</th>
            <th>Description</th>
        </tr>
    </ng-template>
    <ng-template #body let-project>
        <tr>
            <td>{{ project.name }}</td>
            <td>{{ project.description }}</td>
        </tr>
    </ng-template>
</p-table>
