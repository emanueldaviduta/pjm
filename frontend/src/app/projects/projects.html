<p-toast></p-toast>

<div class="text-right mb-4">
    <button pButton label="Add Project" icon="pi pi-plus" (click)="addProject()" [disabled]="isLoading()">Add
        Project</button>
</div>

<p-table [value]="projects()" [tableStyle]="{ 'min-width': '600px' }">
    <ng-template #header>
        <tr>
            <th>Name</th>
            <th>Description</th>
        </tr>
    </ng-template>
    <ng-template #body let-project>
        <tr>
            <td>{{ project.name }}</td>
            <td>{{ project.description }}</td>
        </tr>
    </ng-template>
</p-table>

<p-dialog header="Add Project" [(visible)]="displayDialog" [modal]="true">
    <div class="flex flex-col gap-4">
        <label pLabel="Project Name"></label>
        <input pInputText type="text" placeholder="Project Name" [(ngModel)]="project.name">
    </div>
    <div class="flex flex-col gap-4">
        <label pLabel="Project Description"></label>
        <input pInputText type="text" placeholder="Project Description" [(ngModel)]="project.description">
    </div>
    <ng-template #footer>
        <button type="button" pButton severity="secondary" variant="outlined"
            (click)="displayDialog = false">Cancel</button>
        <button type="button" pButton (click)="saveProject()">Save</button>
    </ng-template>
</p-dialog>
