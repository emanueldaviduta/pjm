<nav id="app-sidebar" class="sidebar" [class.open]="layout.menuOpen()" aria-label="Main"
    (keydown.escape)="layout.closeMenu()">
    <ul class="nav-list">
        @for (link of links; track link.routerLink) {
            <li>
                <a class="nav-link" [routerLink]="link.routerLink" routerLinkActive="active"
                    ariaCurrentWhenActive="page" (click)="layout.closeMenu()">
                    <i [class]="link.icon" aria-hidden="true"></i>
                    {{ link.label }}
                </a>
            </li>
        }
    </ul>

    @if (recentProjects().length) {
        <section aria-labelledby="recent-projects-title">
            <h2 id="recent-projects-title" class="eyebrow">Recent projects</h2>
            <ul class="nav-list">
                @for (project of recentProjects(); track project.id) {
                    <li>
                        <a class="nav-link" [routerLink]="['/projects', project.id]" routerLinkActive="active"
                            ariaCurrentWhenActive="page" (click)="layout.closeMenu()">
                            <span class="key-badge">{{ projectKey(project.name) }}</span>
                            <span class="truncate">{{ project.name }}</span>
                        </a>
                    </li>
                }
            </ul>
        </section>
    }
</nav>
