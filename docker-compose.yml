services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pjm}
      POSTGRES_USER: ${POSTGRES_USER:-pjm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to localhost only: reachable from the host (dotnet run, backups), not from the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionString: Host=db;Port=5432;Database=${POSTGRES_DB:-pjm};Username=${POSTGRES_USER:-pjm};Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      TokenKey: ${TOKEN_KEY:?set TOKEN_KEY in .env}
      # The user with this email becomes Admin (at startup, or when they register).
      AdminEmail: ${ADMIN_EMAIL:-}
      # Attachment storage; leave empty to create email tasks without attachments.
      CloudinarySettings__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      CloudinarySettings__ApiKey: ${CLOUDINARY_API_KEY:-}
      CloudinarySettings__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
